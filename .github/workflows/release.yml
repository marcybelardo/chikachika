name: Publish release

run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to publish, for example v0.0.1
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "::error::$RELEASE_TAG must be an existing annotated tag."
            exit 1
          fi
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chikachika") | .version')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::$RELEASE_TAG does not match Cargo package version $package_version."
            exit 1
          fi
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked --all-targets

  documentation:
    name: Documentation and browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run embedded browser client tests
        run: node --test tests/browser_overlay.test.mjs
      - name: Validate documentation
        run: python3 scripts/check_docs.py
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

  publish:
    name: Publish GitHub release
    needs: [rust, documentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish tagged source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for $RELEASE_TAG."
            exit 1
          fi
          release_args=(
            "$RELEASE_TAG"
            --verify-tag
            --generate-notes
            --title "Chikachika ${RELEASE_TAG#v}"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
