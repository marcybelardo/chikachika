[package]
name = "chikachika"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = "0.7"
eframe = "0.29"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "test-util", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
directories = "6"
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
